<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>KILL MORE</title><style>*{box-sizing:border-box}body{margin:0;background:#030b1b;color:white;font-family:Arial;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:bold}button{position:fixed;bottom:24px;border:2px solid #7ce7ff;border-radius:16px;padding:18px;background:#17476ddd;color:white;font-weight:bold;font-size:18px;touch-action:none}#left{left:18px}#right{left:100px}#fire{right:18px;background:#b83437dd;border-color:#ffc46b}#start{position:fixed;inset:40% 20%;bottom:auto;background:#ffbf55;color:#101b2a}</style></head><body><canvas id="c"></canvas><div id="hud"><span id="lv">LEVEL 1</span><span id="sc">SCORE 0</span><span id="hp">♥♥♥</span></div><button id="left">◀</button><button id="right">▶</button><button id="fire">FIRE</button><button id="start">START MISSION</button><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let w,h,p,bul=[],bad=[],score=0,level=1,hp=3,dir=0,fire=false,started=false,last=0,spawn=0;function size(){w=c.width=innerWidth;h=c.height=innerHeight;p=p||{x:w/2,y:h*.78};p.y=h*.78}onresize=size;size();function shoot(){bul.push({x:p.x,y:p.y-20})}document.querySelector('#start').onclick=()=>{started=true;score=0;level=1;hp=3;bul=[];bad=[];p={x:w/2,y:h*.78};document.querySelector('#start').style.display='none'};for(let [id,d] of [['left',-1],['right',1]]){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();dir=d};b.onpointerup=b.onpointercancel=()=>dir=0}let f=document.querySelector('#fire');f.onpointerdown=e=>{e.preventDefault();fire=true;shoot()};f.onpointerup=f.onpointercancel=()=>fire=false;onkeydown=e=>{if(e.key==='ArrowLeft')dir=-1;if(e.key==='ArrowRight')dir=1;if(e.key===' '){fire=true;shoot()}};onkeyup=e=>{dir=0;fire=false};function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;x.fillStyle='#030b1b';x.fillRect(0,0,w,h);let ex=w*.76,ey=h*.2,r=Math.min(w,h)*.15,g=x.createRadialGradient(ex-r*.4,ey-r*.4,2,ex,ey,r);g.addColorStop(0,'#5df4ff');g.addColorStop(1,'#10418e');x.fillStyle=g;x.beginPath();x.arc(ex,ey,r,0,7);x.fill();for(let i=0;i<75;i++){x.fillStyle='#ffffff88';x.fillRect((i*173)%w,(i*97+t*.025)%h,2,2)}if(started){p.x=Math.max(20,Math.min(w-20,p.x+dir*250*dt));spawn-=dt;if(spawn<=0){bad.push({x:25+Math.random()*(w-50),y:-20,v:100+level*8});spawn=Math.max(.32,1-level*.04)}if(fire&&Math.random()<.25)shoot();bul.forEach(b=>b.y-=500*dt);bul=bul.filter(b=>b.y>0);for(let i=bad.length-1;i>=0;i--){let e=bad[i];e.y+=e.v*dt;if(e.y>h||Math.hypot(e.x-p.x,e.y-p.y)<20){bad.splice(i,1);hp--;if(hp<=0){started=false;document.querySelector('#start').textContent='GAME OVER — PLAY AGAIN';document.querySelector('#start').style.display='block'}}else for(let j=bul.length-1;j>=0;j--)if(Math.hypot(e.x-bul[j].x,e.y-bul[j].y)<18){bad.splice(i,1);bul.splice(j,1);score+=10;if(score>=level*100)level++;break}}x.fillStyle='#a5f5ff';bul.forEach(b=>x.fillRect(b.x-2,b.y-10,4,12));bad.forEach(e=>{x.fillStyle='#ff536d';x.beginPath();x.moveTo(e.x,e.y+14);x.lineTo(e.x+14,e.y-9);x.lineTo(e.x,e.y-3);x.lineTo(e.x-14,e.y-9);x.fill()});x.fillStyle='#8ceaff';x.beginPath();x.moveTo(p.x,p.y-24);x.lineTo(p.x+20,p.y+18);x.lineTo(p.x,p.y+10);x.lineTo(p.x-20,p.y+18);x.fill();document.querySelector('#lv').textContent='LEVEL '+level;document.querySelector('#sc').textContent='SCORE '+score;document.querySelector('#hp').textContent='♥'.repeat(Math.max(0,hp))}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
