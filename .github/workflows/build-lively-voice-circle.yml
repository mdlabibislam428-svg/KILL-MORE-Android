name: Build Lively Voice Circle APK
on:
  workflow_dispatch:
  push:
    paths:
      - "lively-voice-circle-android/**"
      - ".github/workflows/build-lively-voice-circle.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: lively-voice-circle-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lively-Voice-Circle-APK
          path: lively-voice-circle-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
